# Phase 0 stack: the relational core. The API and workstation join in Phase 1.
# Copy .env.example to .env first. Data volume is named so `docker compose down`
# never destroys transcription labor; only an explicit `docker volume rm` can.
services:
  db:
    image: postgres:16
    container_name: jpocr-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jpocr}
      POSTGRES_USER: ${POSTGRES_USER:-jpocr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - jpocr_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jpocr} -d ${POSTGRES_DB:-jpocr}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  jpocr_pgdata:
