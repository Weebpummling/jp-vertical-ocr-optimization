name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Schema applies to a fresh database
        # No service container: the database is a SQLite file, so CI builds one
        # the same way a laptop does.
        run: python -c "import sys; sys.path.insert(0,'app'); import db; db.create('ci-check.db').close()"
      - name: Controlled vocabularies load
        # observation.rank_code and .branch_code are foreign keys into these, so
        # an empty vocabulary means no officer can be recorded at all.
        env:
          JPOCR_DB: ci-check.db
        run: python scripts/load_vocab.py
      - name: Lint controlled vocabularies
        run: python scripts/lint_vocab.py
      - name: Install reading-layer dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Reading-layer unit tests
        run: python -m unittest discover -s reading -p "test_*.py" -v
      - name: Workstation unit tests
        run: python -m unittest discover -s app -p "test_*.py" -v
