name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema-and-vocab:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jpocr
          POSTGRES_USER: jpocr
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jpocr -d jpocr"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema to a fresh database
        env:
          PGPASSWORD: ci
        run: psql -h localhost -U jpocr -d jpocr -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: Audit triggers hold their guarantees
        env:
          PGPASSWORD: ci
        run: psql -h localhost -U jpocr -d jpocr -v ON_ERROR_STOP=1 -f db/audit_check.sql
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint controlled vocabularies
        run: python scripts/lint_vocab.py
      - name: Install reading-layer dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Reading-layer unit tests
        run: python -m unittest discover -s reading -p "test_*.py" -v
      - name: Workstation unit tests
        run: python -m unittest discover -s app -p "test_*.py" -v
